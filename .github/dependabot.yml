version: 2

updates:
  # Actions are pinned to full commit SHAs, which is what stops a moved tag
  # executing unreviewed code in a workflow that holds repository secrets.
  # The cost of pinning is going stale, so Dependabot proposes the bumps —
  # it understands SHA pins and rewrites both the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
    labels:
      - dependencies
    groups:
      # init and analyze are one action in one repository and share a version
      # check at runtime. Dependabot's default is a PR per action, which
      # upgrades one half and leaves the other behind — neither PR can pass.
      codeql-action:
        patterns:
          - 'github/codeql-action*'

  # `bun`, not `npm`: this repository's only lockfile is bun.lock. The npm
  # ecosystem edits package.json without touching it, so every pull request it
  # opened failed `bun install --frozen-lockfile` in the quality job.
  #
  # The trade is that the bun ecosystem does not support Dependabot *security*
  # updates, only version updates. Advisories are still caught on every push
  # and pull request by the dependency-scan job (`bun audit`), so they are
  # detected rather than auto-proposed.
  - package-ecosystem: bun
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - dependencies
    groups:
      # The dev toolchain moves together and is not in the shipped artifact;
      # reviewing oxlint and prettier patch bumps one PR at a time is noise.
      #
      # Majors are excluded deliberately. The first run of this group produced
      # a PR titled "bump the dev-toolchain group with 3 updates" that
      # contained TypeScript 5.9 -> 7.0 — a compiler replacement — alongside
      # two lint bumps. A grouped major reads as routine and reviews as
      # routine, which is exactly when it should not. Majors now arrive on
      # their own and get judged on their own.
      dev-toolchain:
        dependency-type: development
        update-types:
          - minor
          - patch
        patterns:
          - '@oxlint/*'
          - 'oxlint'
          - 'prettier*'
          - 'typescript'
    ignore:
      # Bun is pinned deliberately and upgraded as a decision, not a bump —
      # see MWP-97. Left to Dependabot it would drift the runtime the whole
      # project is tested against.
      - dependency-name: 'bun-types'
