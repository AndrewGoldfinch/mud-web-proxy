name: CodeQL

# Static analysis for a network-facing proxy on a public repository — the
# cheapest control available, and the one most likely to catch a class of
# defect that review misses.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, so newly published queries reach existing code rather than only
    # code that happens to change.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      # Scoped to this job rather than the workflow: the repository default is
      # read-only, and only this step needs to publish results.
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # init and analyze must stay on the same version. Upgrading one alone
      # fails with "Loaded a configuration file for version X, but running
      # version Y" — see the codeql-action group in dependabot.yml, which
      # keeps them in a single pull request.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: '/language:javascript-typescript'
